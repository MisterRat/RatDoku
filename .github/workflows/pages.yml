name: Deploy RatDoku to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Adds the Google Analytics tag only to the copy published on GitHub Pages.
      # The ID comes from the repo's GA_MEASUREMENT_ID variable (Settings → Secrets
      # and variables → Actions → Variables); with no variable, nothing is added.
      - name: Add Google Analytics tag
        if: ${{ vars.GA_MEASUREMENT_ID != '' }}
        env:
          GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
          SITE_DIR: dist
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          gid = os.environ["GA_ID"].strip()
          if not re.fullmatch(r"G-[A-Z0-9]+", gid):
              sys.exit(f"GA_MEASUREMENT_ID {gid!r} doesn't look like a GA4 ID (G-XXXXXXXXXX)")
          tag = (
              "<!-- Google tag (gtag.js) -->\n"
              f'<script async src="https://www.googletagmanager.com/gtag/js?id={gid}"></script>\n'
              "<script>\n"
              "  window.dataLayer = window.dataLayer || [];\n"
              "  function gtag(){dataLayer.push(arguments);}\n"
              "  gtag('js', new Date());\n"
              f"  gtag('config', '{gid}');\n"
              "</script>\n"
          )
          root = pathlib.Path(os.environ["SITE_DIR"])
          tagged = 0
          for page in sorted(root.rglob("*.html")):
              if any(part in (".git", ".github", "node_modules") for part in page.parts):
                  continue
              html = page.read_text(encoding="utf-8")
              if "googletagmanager.com/gtag/js" in html:
                  continue
              head = re.search(r"<head[^>]*>", html, re.IGNORECASE)
              if not head:
                  continue
              page.write_text(html[: head.end()] + "\n" + tag + html[head.end():], encoding="utf-8")
              print(f"Tagged {page}")
              tagged += 1
          print(f"{tagged} page(s) tagged with {gid}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
